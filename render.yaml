# One-click backend deploy: Render → New → Blueprint → point at this repo.
#
# The frontend is deployed separately on Vercel with the root directory set to
# `frontend/` and NEXT_PUBLIC_API_URL pointing at the URL this service gets.
services:
  - type: web
    name: zoomeet-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    # Migrations run before the app boots, so a deploy that changes the schema
    # applies it exactly once and a failed migration stops the release.
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: JWT_SECRET
        generateValue: true
      # Add your Vercel domain here (any *.vercel.app origin is already allowed
      # by the regex in app/main.py, so this is for custom domains).
      - key: CORS_ORIGINS
        value: https://zoom-clone-six-wine.vercel.app
      # The free plan has no persistent disk: with the default SQLite file every
      # restart starts an empty database. For real use attach a disk and set
      # sqlite:////var/data/zoomeet.db, or point this at Postgres.
      # - key: DATABASE_URL
      #   sync: false
      - key: MOCK_OTP
        value: "123456"
      # Google Sign-In client id. Set it in the Render dashboard (or here) to
      # turn on "Continue with Google"; unset, the button is hidden.
      - key: GOOGLE_CLIENT_ID
        sync: false
